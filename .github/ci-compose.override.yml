# ==================================================================
# CI 专用的 compose 覆盖文件 —— 只做一件事：把 Redis 临时暴露到【回环】
# ==================================================================
# 为什么需要它：
#   docker-compose.yml 里故意**不**映射 Redis 端口（少一个暴露面，外面根本不需要连它）。
#   但 CI 要验的其中两件事必须**从外面直接读写 Redis**：
#     · 计数确实落在 Redis 里（读 key + 看 TTL）
#     · 把日用量顶到上限 ⇒ 服务必须按 daily_req 拒（证明它读的是 Redis，不是自己内存）
#   ⇒ 用覆盖文件把 6379 只绑到 127.0.0.1（**不是** 0.0.0.0），把"少一个暴露面"这个默认保住。
#
# ★ 为什么不把端口直接写进 docker-compose.yml：那会让每个人的本机 Redis 都可能撞端口，
#   而"本机 6379 上正好有个别的 Redis"是很容易发生的事（本次开发机上就真有一个 Memurai）。
# ★ 这份文件只给 CI 用，不参与本机与生产。
services:
  redis:
    ports:
      - "127.0.0.1:6379:6379"
