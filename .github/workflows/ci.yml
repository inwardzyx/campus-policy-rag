# ==================================================================
# CI —— 每次 push / PR 自动跑测试
# ==================================================================
# 为什么拆成两个 job，而不是一个：
#   tests/ 里的测试成本差一个数量级 ——
#     test_loader.py                  只解析文件，不碰 embedding 模型 → 几秒
#     test_guard.py / test_eval_set.py 要加载 91MB 的 bge 模型      → 十几秒起
#   合成一个 job 的话，改一行 loader 也要等模型下载完才能知道对不对。
#   拆开之后：快 job 很快给出答案，慢 job 并行跑，互不拖累。
#
# ★ 刻意【不配】DEEPSEEK_API_KEY：
#   tests/test_guard.py 自带假模型（monkeypatch 注入），测试里一条都不调真生成模型。
#   所以 CI 不需要任何密钥 —— 也就没有"密钥泄漏到 CI 日志"这条风险。
#
# ★ 慢 job 的 pip 那一步，顺带就是 Dockerfile 里 pip 层的【预演】：
#   同样是 Linux + Python 3.14。它红了 = Docker 也会红，
#   而在这里改（2 分钟）远比在容器里手调（半天）便宜。
#   所以 CI 不只是"质量门"，还是发现部署问题最便宜的探针。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:            # 允许在 Actions 页面手点运行，方便调试

jobs:
  # ----------------------------------------------------------------
  # 快 job：纯解析，不装模型
  # ----------------------------------------------------------------
  fast:
    name: 快 job · 加载器（不装模型）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"      # ★ 引号不能省：不加引号 3.14 会被 YAML 当浮点数，成了 3.1

      - name: 只装测试框架（kb/loader.py 只用标准库）
        run: python -m pip install --upgrade pip pytest

      - name: 验证 install_hooks.py 在 Linux 上也能用（不只是在 Windows 上）
        # ★ 为什么放在这个 job：它的环境**最接近「别人 clone 下来的样子」** ——
        #   干净、从没装过钩子。所以这里恰好能验证两件事，而且都能证伪：
        #     ① 没装时 `--check` 必须【非 0】退出 —— 否则"检查装没装"就是一句空话；
        #     ② 装上之后 `--check` 必须 0，且那个"现场证明"（真跑一次 pre-commit）要通过。
        #   ⇒ 顺带把「我在 Windows 上测过」升级成「两个平台都测过」。
        #   ★ 这段只依赖 Python 标准库 + git，所以能待在只装了 pytest 的快 job 里。
        run: |
          set -euo pipefail
          echo "① 干净环境（= 新 clone）里 --check 应当【非 0】"
          if python scripts/install_hooks.py --check; then
            echo "::error::--check 在没装钩子的环境里返回了 0 —— 这个检查是假的"
            exit 1
          fi
          echo "② 装上之后 --check 应当 0（同时它会真跑一次 pre-commit 自证）"
          python scripts/install_hooks.py --quiet
          python scripts/install_hooks.py --check

      - name: 核"仓库内路径引用"是不是真的存在（只读文本 + git）
        # ★ 起因：2026-10-13 一次扫出 5 处指错的路径（README 指一份不存在的报告、
        #   两个文件把 mcp/ 的探针写成 agent/、注释指一个不存在的 tests 文件…）。
        #   这类错只有"读的人照着去找、找不到"才发现，所以必须机械查。
        # ⚠️ 它靠 `.gitignore` 区分"运行时产物本来就没有"与"路径指错了"，
        #   所以在**干净 checkout**（= 最接近别人 clone 的样子）里跑最有意义。
        # ★ 为什么这道能进快 job：只用标准库 + git，不装模型。
        #   （★ `check_judge_rules.py` 不能进这里：它要读 CLAUDE.md，
        #     而 CLAUDE.md 按 .gitignore 不进仓库 ⇒ 在 CI 里它会**正确地报红**。）
        run: python scripts/check_file_refs.py

      - name: 跑"判据的判据"：变异测试（这三个不需要模型，也不需要 gitignored 的数据）
        # ★ 起因（2026-10-13）：发现 `mutate_check_numbers.py` **红了一整天没人知道** ——
        #   README 的 token 表从 1906 改成 1900 之后，它三条变异的原文串失效、当场报红，
        #   可是**没有任何闸门在跑它**：pre-push 按设计只做"几毫秒能查完"的检查，
        #   CI 里也没有它。⇒ 判据红了没人看见，等于没有判据。
        # ★ 为什么这三个能进快 job：它们只是反复跑那几个对账器，而对账器只用标准库。
        # ⚠️ `mutate_check_token.py` 进不来：它要读 agent/_token_cost.json，
        #    那份数据按 .gitignore 不进仓库（在干净 checkout 里它会正确地报"缺数据"）。
        #    它是唯一一个"必须在本机跑"的变异套件，所以它由 hooks 前的自查负责。
        run: |
          set -euo pipefail
          python scripts/mutate_check_numbers.py
          python scripts/mutate_check_artifact.py
          python scripts/mutate_check_refs.py

      - name: 跑加载器测试
        run: python -m pytest tests/test_loader.py -v

  # ----------------------------------------------------------------
  # 慢 job：装全套依赖 + 下模型，跑质量门
  # ----------------------------------------------------------------
  full:
    name: 慢 job · 把关 + 评测门禁（装模型）
    runs-on: ubuntu-latest
    env:
      # ★ 这行必须加：service.py 用 os.environ.setdefault 把默认值设成
      #   https://hf-mirror.com（国内镜像）。GitHub 的 runner 在海外，
      #   走国内镜像大概率慢或超时。因为源码用的是 setdefault，
      #   这里设个环境变量就能覆盖它 —— 零改代码。
      HF_ENDPOINT: https://huggingface.co
      # 测试不调生成模型，不需要往 LangSmith 上报 trace
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip                  # 按 requirements.txt 的内容哈希缓存 wheel

      - name: 装依赖（同时是 Dockerfile pip 层的预演）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 跑把关 + 评测门禁 + 模型故障守门
      # 质量门是【零容忍】的：慢 job 跑的三个文件全部注入假模型（tests/conftest.py），
      #   一次都不真调生成模型 ⇒ 结果是确定性的，数字一变就是真的变了
      #   （Recall / 漏答率的断言见 tests/test_eval_set.py）。
      # ★ 2026-09-27 改真话：这里原来写的是「离线层不调 LLM，所以结果是确定性的」——
      #   那是假的。use_rerank=false 关掉的是【精排】那一层，生成答案那一步
      #   （service.py:605 的 rag.answer()）照样要调模型。
      #   后果有两面：① 没配 key 的机器上 pytest 必红（test_no_answerable_missed）；
      #   ② 配了 key 的机器上，14 道应答题每跑一次真烧 14 次调用 ——
      #      测试变成"要网、要钱、结果还可能不一样"，而这段注释却宣称它是确定性的。
      #   现在靠注入假模型，①②一起解决，这句话才真正成立。
        # 环境性失败（装不上、下不动模型）应当改版本，永远不要用 skip 掩盖。
        #
        # ★ 2026-09-25 补上 tests/test_llm_resilience.py：之前只跑了前两个文件，
        #   那 5 条「超时 / 返回垃圾 / 幻觉 id / 超长输入」的守门测试【在 CI 里根本没跑】——
        #   同样是"测试写了但没人跑"的摆设。已验证它们不依赖 DEEPSEEK_API_KEY，
        #   能在干净的 CI 环境里跑（删掉 key 实测 5 passed）。
        run: python -m pytest tests/test_guard.py tests/test_eval_set.py tests/test_llm_resilience.py -v

  # ----------------------------------------------------------------
  # 容器 job：证明「镜像里真的跑得起来」
  # ----------------------------------------------------------------
  # 为什么不靠上面两个 job 推：慢 job 验证的是【runner 上】装得上
  #   （setup-python + pip），而镜像里不是 runner 的环境 ——
  #   差一个 libgomp1 就够让 import onnxruntime 当场炸。
  #   所以「CI 绿了」推不出「容器能跑」，除非真的在容器里跑一次。
  #   这是本次加 Dockerfile 时唯一值得新开一个 job 的理由。
  #
  # ★ 全程不配 DEEPSEEK_API_KEY。下面断言的两条路径都不需要模型生成：
  #   ① 入库把关（tests/test_guard.py 通过 conftest 注入假模型）
  #   ② /chat 的 use_rerank=false 拒答路径（走向量阈值，不碰模型）
  #   ⇒ 容器 job 里同样没有密钥，也就没有「密钥泄漏进 CI 日志」这条风险。
  #   ★ 反面说清楚：/chat 的【默认】路径（use_rerank=true）在这个 job 里
  #     是 500 —— 那是刻意的（缺 key = 配置错误要炸出来，见 service.py:228），
  #     所以这里不去断言它，免得把「有意为之」写成一个看着像 bug 的期望值。
  docker:
    name: 容器 job · 构建 + 容器内跑门禁 + 起服务打接口
    runs-on: ubuntu-latest
    env:
      # 与慢 job 同理：runner 在海外，镜像源必须覆盖成 huggingface.co
      # （service.py 用 setdefault 设成国内镜像，这里覆盖它，零改代码）
      HF_ENDPOINT: https://huggingface.co
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t rag-cs:ci .

      - name: 记下镜像体积（只打印，不冻进 README）
        # ★ 为什么是"打印"而不是"写进 README 一个数"（cc 盲审指出）：
        #   base 镜像一更新这个数就过期，而 check_readme_numbers.py 无法对它
        #   【现算】—— 冻进文档就成了一个没人能对账的数字，
        #   正是这份 README 一直在剿的东西。要看就来这里看。
        #
        # ★ 为什么额外发一条 ::notice::（2026-10-11 实测后加的）：
        #   Actions 的【日志】接口要 token —— 未认证 GET /actions/jobs/{id}/logs 返回 403；
        #   而工作流命令会变成【check-run 注解】，注解接口**不需要 token**
        #   （实测 GET {check_run_url}/annotations → 200，能读到真实的 notice / warning）。
        #   ⇒ 凡是想让"不登录也能机械读到"的数字，走 ::notice:: 比走日志靠谱。
        run: |
          size=$(docker image inspect rag-cs:ci --format '{{.Size}}')
          echo "镜像体积（字节）：$size"
          docker images rag-cs:ci
          echo "::notice::镜像体积 = $((size / 1024 / 1024)) MB（$size 字节）"

      - name: 在【容器里】跑入库把关门禁
        # tests/test_guard.py 已写死「263 留 / 23 拦」，所以这一步同时证明四件事，
        # 且都不是「看着对」：
        #   · 镜像里依赖齐（缺 libgomp1 会在这里 import 就炸）
        #   · 模型下得动（HF_ENDPOINT 指向 huggingface.co）
        #   · 语料解析与五道关的判定跟本地一致
        #   · 容器的 Python 3.14 真装得上这套依赖
        # ★ 复用测试里那份真相源，而不是在 workflow 里再抄一遍 263/23：
        #   抄一遍就等于多一个没人同步的过期数字。
        run: |
          docker run --rm \
            -e HF_ENDPOINT="$HF_ENDPOINT" \
            -e LANGSMITH_TRACING=false \
            rag-cs:ci python -m pytest tests/test_guard.py -q

      - name: 起服务容器
        run: |
          docker run -d --name rag -p 127.0.0.1:8000:8000 \
            -e HF_ENDPOINT="$HF_ENDPOINT" \
            -e LANGSMITH_TRACING=false \
            rag-cs:ci

      - name: 等就绪（首次要下 92MB 模型）
        # 不 sleep 一个拍脑袋的固定秒数：那样要么白等、要么不够。
        # 改成轮询 /health，只在它真的说出 status=ok 时才往下走。
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health -o /tmp/health.json 2>/dev/null \
               && grep -q '"status":"ok"' /tmp/health.json; then
              echo "第 ${i} 次轮询就绪：$(cat /tmp/health.json)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::容器 450 秒内没就绪（/health 一直不是 ok）"
          exit 1

      - name: 断言「不需要密钥的那两条路」在容器里真的通
        run: |
          set -euo pipefail

          echo "── ① 入库把关：排除「服务起来了但库是空的」──"
          health=$(curl -sf http://127.0.0.1:8000/health)
          echo "$health"
          echo "$health" | grep -qE '"chunks":[1-9][0-9]+' \
            || { echo "::error::chunks 不是一个大数 —— 库里没东西"; exit 1; }
          echo "$health" | grep -qE '"rejected":[1-9][0-9]*' \
            || { echo "::error::没有任何资料被拦下 —— 五道关没跑"; exit 1; }

          echo "── ② 拒答路径（use_rerank=false，全程不调模型）──"
          resp=$(curl -sf -X POST http://127.0.0.1:8000/chat \
                   -H 'Content-Type: application/json' \
                   -d '{"question":"图书馆几点关门？","use_rerank":false,"use_rewrite":false}')
          echo "$resp"
          echo "$resp" | grep -q '"knowledge_hit":false' \
            || { echo "::error::库里没有的问题没有拒答（knowledge_hit 不是 false）"; exit 1; }

      - name: 用 compose 起【服务 + Redis】，验"配额真的挡住了"（一条命令能起）
        # ★ 为什么必须单独验一次 compose，而不是"已经有 docker run 了就够了"：
        #   compose 多了三样独立会坏的东西 —— ① Redis 服务本身
        #   ② 启动顺序（服务要等 Redis 健康）③ 环境变量/卷的接线。
        #   而这三样**只在 compose 里存在**，docker run 那条路一个字都没覆盖。
        #
        # ★ 为什么这些断言必须打真接口，而不是在容器里跑 pytest：
        #   限流要验的是"跨进程"的行为（计数在 Redis 里、服务重启不丢），
        #   pytest 进程内测不到它 —— 那正是 test_limits.py 里两种存储各跑一遍的意义，
        #   而这里是端到端那一层。
        #
        # ★ 配额调成"一测就满"：RATE_BURST=3 / 每分钟补 1 / 日请求 5。
        #   默认值（10/20/200）在 CI 里跑不出 429，硬等一两分钟又会变成偶发失败。
        env:
          HOST_PORT: "8080"
          RATE_BURST: "3"
          RATE_PER_MIN: "1"
          DAILY_REQ_QUOTA: "5"
          DAILY_TOKEN_QUOTA: "0"          # 关掉：没有 key 的路径本来就不花 token
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080
          Q='{"question":"图书馆几点关门？","use_rerank":false,"use_rewrite":false}'

          echo "── 起栈（--build 复用上面建好的镜像层缓存）──"
          docker compose up -d --build

          echo "── 等服务就绪（首次要在卷里下 91MB 模型；healthcheck 只要求 HTTP 200）──"
          for i in $(seq 1 120); do
            if curl -sf "$API/health" -o /tmp/h.json 2>/dev/null && grep -q '"status":"ok"' /tmp/h.json; then
              echo "第 ${i} 次轮询就绪：$(cat /tmp/h.json)"
              break
            fi
            sleep 5
            [ "$i" -eq 120 ] && { echo "::error::compose 栈 600 秒内没就绪"; docker compose logs --tail 60; exit 1; }
          done

          echo "── ① 限流口径必须是 redis（不是内存）──"
          python3 - <<'PY'
          import json, sys, urllib.request
          h = json.load(urllib.request.urlopen("http://127.0.0.1:8080/health"))
          lim = h["limits"]
          print("limits =", lim)
          assert lim["store"] == "redis", f"限流存储不是 redis 而是 {lim['store']} ⇒ 多副本下配额会被放大"
          assert lim["store_ok"] is True, "Redis 不通"
          assert lim["fail_mode"] == "closed", lim["fail_mode"]
          PY

          echo "── ② 突发 3 次放行、第 4 次 429（桶）──"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$API/chat" -H 'Content-Type: application/json' -d "$Q")
            [ "$code" = "200" ] || { echo "::error::第 $i 次请求应当 200，实际 $code：$(cat /tmp/r.json)"; exit 1; }
          done
          code=$(curl -s -D /tmp/hdr.txt -o /tmp/r.json -w '%{http_code}' -X POST "$API/chat" -H 'Content-Type: application/json' -d "$Q")
          echo "第 4 次：$code  $(cat /tmp/r.json)"
          [ "$code" = "429" ] || { echo "::error::突发用完却没被限流（$code）"; exit 1; }
          grep -qi '^retry-after:' /tmp/hdr.txt || { echo "::error::429 没带 Retry-After"; exit 1; }
          python3 -c "import json;d=json.load(open('/tmp/r.json'));assert d['detail']['reason']=='rate',d"

          echo "── ③ 重启服务容器：日计数必须还在（这是『用 Redis』的全部意义）──"
          before=$(curl -sf "$API/limits" | python3 -c "import json,sys;print(json.load(sys.stdin)['usage']['requests_used'])")
          docker compose restart rag
          for i in $(seq 1 60); do
            curl -sf "$API/health" -o /tmp/h.json 2>/dev/null && grep -q '"status":"ok"' /tmp/h.json && break
            sleep 3
          done
          after=$(curl -sf "$API/limits" | python3 -c "import json,sys;print(json.load(sys.stdin)['usage']['requests_used'])")
          echo "重启前 requests_used=$before，重启后=$after"
          [ "$before" = "$after" ] && [ "$after" -ge 3 ] \
            || { echo "::error::重启后计数变了（$before → $after）⇒ 配额其实存在进程里"; exit 1; }

          echo "── ④ 计数确实落在 Redis 里（不是服务内存里的幻觉）──"
          keys=$(docker compose exec -T redis redis-cli --scan --pattern 'q:*' | head -5)
          echo "Redis 里的配额 key：$keys"
          [ -n "$keys" ] || { echo "::error::Redis 里没有配额 key"; exit 1; }

          echo "── ⑤ 把 Redis 里的日用量顶到上限 ⇒ 必须按 daily_req 拒（且 Retry-After 到 UTC 零点）──"
          read -r WHO DAY <<<"$(curl -sf "$API/limits" | python3 -c "import json,sys;u=json.load(sys.stdin)['usage'];print(u['who'],u['day_utc'])")"
          echo "who=$WHO day=$DAY"
          docker compose exec -T redis redis-cli set "q:$DAY:$WHO:req" 999 >/dev/null
          code=$(curl -s -D /tmp/hdr2.txt -o /tmp/r2.json -w '%{http_code}' -X POST "$API/chat" -H 'Content-Type: application/json' -d "$Q")
          echo "改写额度后：$code  $(cat /tmp/r2.json)"
          [ "$code" = "429" ] || { echo "::error::Redis 里的额度满了，服务却没拦（$code）⇒ 它读的不是 Redis"; exit 1; }
          python3 -c "import json;d=json.load(open('/tmp/r2.json'));assert d['detail']['reason']=='daily_req',d"
          python3 -c "
          import re
          ra=int(re.search(r'(?im)^retry-after:\s*(\d+)', open('/tmp/hdr2.txt').read()).group(1))
          assert 1 <= ra <= 86400, f'Retry-After={ra} 不是到 UTC 零点的秒数'"

          echo "── ⑥ 拿不到 usage 时必须留痕（不许补 0 当成'没花钱'）──"
          curl -sf "$API/health" | python3 -c "
          import json,sys
          lim=json.load(sys.stdin)['limits']
          print('usage_missing =', lim['usage_missing'])
          assert lim['usage_missing'] >= 1, '拒绝路径没拿到 usage，但 usage_missing 是 0 ⇒ 缺口被静默抹平'"

      - name: 收尾：把 compose 栈拆掉
        if: always()
        run: docker compose down -v || true

      - name: 挂了就把容器日志倒出来
        # 否则失败信息只有一句"exit 1"，查起来只能靠猜。
        if: failure()
        run: |
          docker logs --tail 80 rag || true
          echo "---- compose 栈 ----"
          docker compose ps || true
          docker compose logs --tail 80 || true
