# 入口层的租户隔离（noisy neighbor 第二轮 §十 用）
#
# 为什么用 nginx 而不是在应用里再调参数：
#   实测（experiments/noisy-neighbor.md §9.3）噪音期的 /health 慢 30 倍而 CPU 只到 57%
#   ⇒ 每秒上千次「拒绝」本身就把单进程的事件循环占满了。
#   要真正解决，必须让这些请求**根本进不到应用进程**——那是入口层的活。
#
# 这里量的是同一件事：把「按租户限速 + 限并发」放到 nginx（C 进程，自己的事件循环），
# 应用进程只看见"被放行的那部分"，噪音租户再吵也吵不到邻居。

worker_processes 1;

events {
    worker_connections 8192;
}

http {
    # ★ 键用 X-Client-Id（实验里 A/B 就是这么区分的）。
    #   ⚠️ 生产不能直接信这个头：得先用网关/SSO 把它换成不可伪造的身份
    #   （本项目 limits.py 的 client_id() 默认就不信它，只有 ALLOW_CLIENT_ID_HEADER=1 才认）。
    limit_req_zone  $http_x_client_id zone=tenant_rate:10m rate=120r/s;
    limit_conn_zone $http_x_client_id zone=tenant_conn:10m;

    log_format t '$request $status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout t;

    upstream app {
        server host.docker.internal:8060;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            # ① 速率：每位租户 120 r/s（B 正常只要 ~85 r/s，A 打满 ~1500 r/s）
            limit_req zone=tenant_rate burst=40 nodelay;
            limit_req_status 429;
            # ② 并发：每位租户 2 条连接 —— 与应用的 MAX_CONC_PER_CALLER 同口径，
            #    但拒绝发生在**应用之外**，不花应用的 CPU/GIL。
            #    ⚠️ 语法坑：`limit_conn` 用**裸 zone 名**（`limit_conn tenant_conn 2`），
            #    写成 `limit_conn zone=tenant_conn 2` 会被当成一个叫 "zone=tenant_conn" 的 zone，
            #    启动直接 emerg: zero size shared memory zone（2026-11-20 实测踩到）。
            limit_conn tenant_conn 2;
            limit_conn_status 429;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Client-Id $http_x_client_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering on;
            # ★ 别关 proxy_buffering（2026-11-20 实测）：关掉之后每个 POST /search 多 47ms ——
            #   上游的小分片被立刻转成小 TCP 包，撞上 Windows 的 delayed-ACK（40ms 级）。
            #   /health 走同一条路只多 1.7ms（它没有上游分片），所以那 47ms 不是"网络跳数"。
            proxy_pass http://app;
        }

        location = /health {
            # 健康检查不受限（"防护把自己变成故障"是踩过的坑）
            proxy_pass http://app;
        }
    }
}

